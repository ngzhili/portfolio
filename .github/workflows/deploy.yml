# Builds the static site and deploys it to GitHub Pages on every push to main.
#
# One-time setup in your repo:
#   Settings → Pages → "Build and deployment" → Source: **GitHub Actions**.
# That's it — this workflow does the rest.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions required for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Node 24.15+ ships npm 12, which rejects lockfiles written by npm 11
      # (it demands top-level @emnapi/* entries that npm 11 strips out).
      # Pin npm to the version used locally so the lockfile is validated by
      # the same npm that writes it. Bump both together, never just one.
      - name: Pin npm
        run: npm install -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Build (static export → ./out, includes .nojekyll)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
